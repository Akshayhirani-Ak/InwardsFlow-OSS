name: CI

on:
  push:
    branches: [main, fix/enterprise-hardening]
  pull_request:

jobs:
  app:
    name: App (types, lint, unit, build, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - name: Playwright smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
