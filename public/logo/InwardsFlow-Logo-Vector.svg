<?xml version="1.0" encoding="UTF-8"?>
<svg id="masterLogoSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 375" width="1200" height="375">
          <defs>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Poppins:wght@700;800&amp;display=swap');
              .brand-main-text {
                font-family: 'Poppins', 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif;
                font-weight: 800;
                font-size: 112px;
                letter-spacing: -0.025em;
              }
              .brand-sub-text {
                font-family: 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif;
                font-weight: 700;
                font-size: 21.5px;
                letter-spacing: 0.095em;
              }
            </style>

            <!-- Reusable Isometric Container + Pallets + Arrow Icon Symbol -->
            <g id="inwardsflow-isometric-icon">
              <!-- 1. TOP CONTAINER ROOF (Royal Blue #174EA6) -->
              <polygon points="248,68 140,130 206,168 314,106" fill="#174EA6"/>

              <!-- 2. LEFT CLOSED CONTAINER DOOR WALL (Deep Navy Frame #081F44 + 3D Inner Edge) -->
              <!-- Dark Navy Outer Door Frame -->
              <polygon points="140,130 206,168 206,271 140,233" fill="#081F44"/>
              <!-- Dark Navy 3D Frame Depth Lip -->
              <polygon points="206,168 214,163 214,266 206,271" fill="#061531"/>
              <!-- Left Royal Blue Door Panel -->
              <polygon points="148,144 170,157 170,241 148,228" fill="#174EA6"/>
              <!-- Right Royal Blue Door Panel -->
              <polygon points="176,160 198,173 198,257 176,244" fill="#174EA6"/>

              <!-- 3. OPEN CUTAWAY PALLET / CARGO GRID (6 Top Isometric Tiles + Stacked Vertical Layers) -->
              <!-- White Backing behind cutaway blocks for crisp grid separation -->
              <polygon points="214,168 318,108 366,136 366,192 260,254 214,250" fill="#FFFFFF"/>

              <!-- TOP ISOMETRIC FACES OF PALLET BLOCKS (Row 1: Back-Left & Row 2: Front-Right) -->
              <!-- Row 1, Tile 1 (Bottom-Left Top Tile - Green) -->
              <polygon points="216,172 250,152 271,164 237,184" fill="#0FA362" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
              <!-- Row 1, Tile 2 (Middle Top Tile - Green) -->
              <polygon points="250,152 284,132 305,144 271,164" fill="#0FA362" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
              <!-- Row 1, Tile 3 (Top-Right Top Tile - Green) -->
              <polygon points="284,132 318,112 339,124 305,144" fill="#0FA362" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>

              <!-- Row 2, Tile 4 (Front-Bottom-Left Top Tile - Green) -->
              <polygon points="237,184 271,164 295,178 261,198" fill="#0FA362" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
              <!-- Row 2, Tile 5 (Front-Middle Top Tile - Green) -->
              <polygon points="271,164 305,144 329,158 295,178" fill="#0FA362" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
              <!-- Row 2, Tile 6 (Front-Top-Right Top Tile - Green) -->
              <polygon points="305,144 339,124 363,138 329,158" fill="#0FA362" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>

              <!-- VERTICAL STACKED FACES OF THE CUTAWAY CARGO -->
              <!-- Left-Inside Step Face (Upper Green Pallet Side with horizontal slot) -->
              <polygon points="216,172 237,184 237,196 216,184" fill="#0FA362" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
              <polygon points="216,184 237,196 261,210 261,231 216,205" fill="#0FA362" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>

              <!-- Lower-Left Green Pallet Block (Bottom tier inside container) -->
              <polygon points="216,209 238,222 238,242 261,229 261,248 238,261 216,248" fill="#0FA362" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>

              <!-- Front-Right Face of Column 1 & 2 (Royal Blue Interlocking Box + Pallet Layers) -->
              <!-- Upper Front-Right Blue Box Face (Under Tile 4 & 5) -->
              <polygon points="261,198 329,158 329,202 296,221 296,194 261,214" fill="#174EA6" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
              <!-- Lower-Middle Blue Pallet Layer -->
              <polygon points="261,231 295,211 295,228 261,248" fill="#174EA6" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>

              <!-- Far-Right Column (Under Tile 6 - Royal Blue Stacked Box + Bottom Layer) -->
              <polygon points="329,158 363,138 363,178 329,198" fill="#174EA6" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
              <polygon points="329,198 363,178 363,190 329,210" fill="#174EA6" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>

              <!-- 4. SWEEPING TWO-TONE CURVED ARROW (Emerald Green #0FA362 + Royal Blue #174EA6) -->
              <!-- White outer knockout halo where arrow overlaps container base -->
              <path d="M 278,226 L 377,192 L 348,282 L 331,264 C 268,318 160,316 130,242 C 125,229 125,212 128,198 C 132,235 170,278 238,267 C 266,262 287,248 296,241 L 278,226 Z" fill="#FFFFFF"/>

              <!-- Upper/Inner Swoosh & Left Arrowhead Wing (Emerald Green #0FA362) -->
              <path d="M 129,198&#10;                       C 130,248 175,282 238,270&#10;                       C 267,264 291,250 303,240&#10;                       L 283,227&#10;                       L 373,196&#10;                       C 332,235 285,278 232,292&#10;                       C 172,307 125,268 129,198 Z" fill="#0FA362"/>

              <!-- Lower/Outer Swoosh & Right Arrowhead Wing (Royal Blue #174EA6) -->
              <path d="M 129,205&#10;                       C 127,262 172,299 233,286&#10;                       C 282,276 328,236 373,196&#10;                       L 347,278&#10;                       L 331,261&#10;                       C 288,298 238,315 192,305&#10;                       C 146,295 124,256 129,205 Z" fill="#174EA6"/>
            </g>
          </defs>

          <!-- RENDER LEFT ISOMETRIC ICON -->
          <use href="#inwardsflow-isometric-icon" x="0" y="0"/>

          <!-- RENDER RIGHT BRAND TYPOGRAPHY -->
          <!-- "Inwards" in Deep Navy (#081F44) + "Flow" in Royal Blue (#1548A6) -->
          <text x="394" y="212" class="brand-main-text">
            <tspan fill="#081F44">Inwards</tspan><tspan fill="#1548A6">Flow</tspan>
          </text>

          <!-- TAGLINE ROW: Left Tapered Pointer + Tagline + Right Tapered Pointer -->
          <!-- Left Sharp Pointer Line -->
          <polygon points="402,253 458,250 458,256" fill="#081F44"/>

          <!-- Center Tagline Text -->
          <text x="734" y="261" text-anchor="middle" fill="#081F44" class="brand-sub-text">
          </text>

          <!-- Right Sharp Pointer Line -->
          <polygon points="1010,250 1066,253 1010,256" fill="#081F44"/>
        </svg>